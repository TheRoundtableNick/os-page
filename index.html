<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Closing OS</title>
<style>
  :root{--bg:#09090c;--s1:#111115;--t1:#f4f4f6;--t2:#a2a2b2;--t3:#6a6a7d;--gold:#fab219;--gold2:#ffce55;--red:#f0616d;--bd:#26262f;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;}
  .card{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px;}
  h1{font-size:18px;margin:0 0 4px;} p{margin:0 0 14px;color:var(--t2);font-size:13px;}
  input{width:100%;box-sizing:border-box;font-size:16px;padding:12px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--t1);}
  button{width:100%;margin-top:10px;font-size:14px;font-weight:800;padding:12px;border-radius:10px;border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111115;cursor:pointer;}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;} .meta{color:var(--t3);font-size:11.5px;margin-top:12px;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);}
</style>
</head>
<body>
<div id="lock"><form class="card" id="f">
  <h1>Closing OS</h1>
  <p>Encrypted on this device only. Enter the password once.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="password" autofocus>
  <button type="submit">Open</button>
  <div class="err" id="err"></div>
  <div class="meta" id="meta">loading...</div>
</form></div>
<script>
(async function(){
  var KEY='cos_pages_pw', err=document.getElementById('err'), meta=document.getElementById('meta'), form=document.getElementById('f'), pwEl=document.getElementById('pw');
  var blob=null;
  try{ var r=await fetch('page.enc?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('fetch '+r.status); blob=await r.json(); meta.textContent='built '+(blob.built||'?'); }
  catch(e){ meta.textContent='could not load page.enc ('+e.message+')'; return; }
  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  async function open(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:blob.iter||200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},key,b64(blob.data));
    var html=new TextDecoder().decode(plain);
    var fr=document.createElement('iframe'); fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation-by-user-activation');
    document.body.innerHTML=''; document.body.appendChild(fr); fr.srcdoc=html;
  }
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ try{ await open(saved); return; }catch(e){ try{localStorage.removeItem(KEY);}catch(x){} } }
  form.addEventListener('submit',async function(ev){ ev.preventDefault(); err.textContent=''; var pw=pwEl.value; if(!pw)return;
    try{ await open(pw); try{localStorage.setItem(KEY,pw);}catch(e){} } catch(e){ err.textContent='Wrong password.'; }
  });
})();
</script>
</body>
</html>
